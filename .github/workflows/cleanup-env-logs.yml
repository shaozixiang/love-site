name: 清理过期环境上报（每小时）

# 只删除 admin_logs 中 action=登录页背景-环境上报 且 created_at 超过24小时的记录。
# 正常操作日志、行为日志和业务数据均不受影响；无需执行数据库 SQL。
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cleanup-env-logs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 删除全部租户超过24小时的环境上报
        env:
          SITE_URL: https://love-site-2am.pages.dev
        run: |
          set -euo pipefail
          echo "[$(date -u)] 调用站点受限接口，清理超过24小时的登录页环境上报"
          code=$(curl --silent --show-error --max-time 45 \
            --output /tmp/env-log-cleanup-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"cleanupExpiredEnvReports"}' \
            "$SITE_URL/api/login-bg")
          case "$code" in
            200)
              echo "环境上报清理完成（HTTP $code）"
              head -c 500 /tmp/env-log-cleanup-response.json || true
              ;;
            *)
              echo "::error::环境上报清理失败（HTTP $code）"
              head -c 1000 /tmp/env-log-cleanup-response.json || true
              exit 1
              ;;
          esac
